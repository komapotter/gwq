name: tagpr

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@967f2ab22be958948fb5bd439bfa3d404dd9dee8 # v1.21.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A tag created with GITHUB_TOKEN does not trigger other workflows.
  # Run the existing goreleaser workflow in this run when tagpr tags.
  goreleaser:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/goreleaser.yaml
    with:
      tag: ${{ needs.tagpr.outputs.tag }}
